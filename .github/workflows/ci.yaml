name: Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cache pinned Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-node-${{ matrix.node }}-plugins-v2-${{ hashFiles('quartz.lock.json', 'package-lock.json') }}

      - run: npm ci

      # precheck restores the exact Git commits in quartz.lock.json.
      - name: Check types and style
        run: npm run check

      - name: Unit and local Git integration tests
        run: npm test

      - name: Build and verify the synthetic site
        run: npm run test:smoke

      - name: Install Chromium
        if: runner.os == 'Linux' && matrix.node == 24
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Browser regression tests
        if: runner.os == 'Linux' && matrix.node == 24
        run: npm run test:e2e

      - name: Upload browser report and review screenshots
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.node == 24 }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-regression-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
